function line(a,len,w,o){const cx=Math.cos(a),cy=Math.sin(a);fxPush({k:'beam',x:P.x,y:P.y,a,len,w:Math.max(18,w),col:o.col||'#fff',life:.38});for(let i=1;i<=len/20;i++)parts.push({x:P.x+cx*i*20+(rnd()-.5)*w*0.6,y:P.y+cy*i*20+(rnd()-.5)*w*0.6,vx:(rnd()-.5)*50,vy:(rnd()-.5)*50,l:.5,a:0,c:o.col||'#fff',sz:Math.min(12,4+w/10),sh:1});
 for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,t=dx*cx+dy*cy,pp=Math.abs(dx*cy-dy*cx);if(t>0&&t<len&&pp<w/2+e.r)hitE(e,o);}}
function shoot(a,o){projs.push({x:P.x+Math.cos(a)*16,y:P.y+Math.sin(a)*16,a,vx:Math.cos(a)*(o.spd||480),vy:Math.sin(a)*(o.spd||480),l:o.life||1.2,r:o.r||8,o,pierce:o.pierce||0,hit:[]});}
function tele(x,y,col){fxPush({k:'pillar',x:P.x,y:P.y,col,life:.4});fxPush({k:'trail',x:P.x,y:P.y,x2:x,y2:y,w:14,col,life:.3});burst(P.x,P.y,col,16,120);P.x=x;P.y=y;resolve(P);burst(P.x,P.y,col,16,120);fxPush({k:'pillar',x:P.x,y:P.y,col,life:.5});}
function toCursor(max){const a=aim(),d=Math.min(max,dist(P.x,P.y,mwx(),mwy()));return[P.x+Math.cos(a)*d,P.y+Math.sin(a)*d,a];}

function ally(kind,n,t,o){for(let i=0;i<n;i++){const a=rnd()*6.283;allies.push({kind,x:P.x+Math.cos(a)*30,y:P.y+Math.sin(a)*30,t,o,tg:null,cool:0,ang:0,run:rnd()*6});}}

 if(pf('arrowproof'))for(const a of arrows)if(dist(a.x,a.y,P.x,P.y)<36){a.l=0;burst(a.x,a.y,'#ff9a2a',5,60);}for(const k in P.buf)P.buf[k]-=dt;

 if(P.buf.reflect>0)for(const a of arrows)if(dist(a.x,a.y,P.x,P.y)<40){a.l=0;burst(a.x,a.y,'#ffd04a',5,60);}

 for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;let boom=p.l<=0&&!!p.o.boom;

  if(boom){shake=Math.max(shake,5);const b=p.o.boom;p.o.boom=0;if(p.o.cross)crossBlast(p.x,p.y);else aoe(p.x,p.y,b,p.o);if(p.o.fire)for(let i=0;i<8;i++){const a=i*0.785;fires.push({x:p.x+Math.cos(a)*40,y:p.y+Math.sin(a)*40,t:3});}}

 for(const z of zones2){z.t-=dt;z.tick-=dt;for(const e of enemies){if(e.dead||dist(e.x,e.y,z.x,z.y)>z.r+e.r)continue;

   peers(){const out=[];if(me&&me.id)out.push({peer:me.id,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:myPres,updatedAt:0});if(remote&&remoteId)out.push({peer:remoteId,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:remote,updatedAt:0});return out;},
