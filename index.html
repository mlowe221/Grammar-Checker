*{box-sizing:border-box}

canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.panel.wide{width:min(880px,100%)}

.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;font-size:15px;background:rgba(26,19,16,.9);color:var(--sand);border-radius:6px;padding:12px 16px;margin-bottom:18px}

button{font:700 17px Cinzel,serif;background:var(--ink);color:var(--gold);border:0;border-radius:6px;padding:11px 24px;min-height:44px;cursor:pointer;letter-spacing:.05em;margin:4px}

.reel.lucky{box-shadow:inset 0 0 30px #000,0 0 0 3px #4ad46a,0 0 24px #4ad46a}

.panel.shake{animation:pshake .5s}
@keyframes pshake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
@media(prefers-reduced-motion:reduce){.reel.hint4,.reel.hint5,.panel.shake,.reel.landed .card.win{animation:none}}
.mark{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.res{min-height:52px;font-size:17px;margin:0 0 8px}

.odds span{background:#1a1310;color:var(--rc);border:2px solid var(--rc);border-radius:20px;padding:3px 10px;font-size:14px;font-weight:700}

.wcard b{display:block;font:700 14px Cinzel,serif;color:#fff}
.wcard small{display:block;color:var(--rc);font-weight:700;font-size:12px}
.wcard span{display:block;font-size:13px;line-height:1.3}
.wcard.on{outline:3px solid #fff;outline-offset:2px}

@keyframes myth{0%{box-shadow:0 0 0 6px var(--ink),0 0 0 9px #ff3a5a,0 0 120px 40px #ffd04a}100%{box-shadow:0 0 0 6px var(--ink),0 0 0 9px var(--terra),0 30px 60px rgba(0,0,0,.6)}}
@media(prefers-reduced-motion:reduce){.card.r5,.card.r4,.panel.mythic{animation:none}}

/* ---------- awakening framework: timed effects + helpers ---------- */
const tq=[];function later(t,f){tq.push({t,f});}
function updLater(dt){for(let i=tq.length-1;i>=0;i--){const q=tq[i];q.t-=dt;if(q.t<=0){tq.splice(i,1);try{q.f();}catch(e){console.error(e);}}}
 if(P&&now<(P.awTouch||0))for(const e of enemies)if(!e.dead&&dist(e.x,e.y,P.x,P.y)<e.r+18)hitE(e,{kill:1,label:'KO!',col:'#ffffff'});}
function timeFreeze(L,dur,col){let n=0;for(const e of L){if(e.dead)continue;if((e.tfImm||0)>now){if(!e.tfMsg||e.tfMsg<now){e.tfMsg=now+1;float(e.x,e.y-34,'RESISTS TIME','#bba98a');}continue;}e.tfImm=now+dur+5;hitE(e,{stun:dur*(sty('kronos')?0.5:1),col:col||'#e8d8a0'});n++;}return n;}
const awE=(k,s,dt)=>{P.ak=P.ak||{};P.ak[k]=(P.ak[k]??0)-dt;if(P.ak[k]<=0){P.ak[k]=s;return true;}return false;};
const foes=(r,x,y)=>{x=x??P.x;y=y??P.y;return enemies.filter(e=>!e.dead&&dist(e.x,e.y,x,y)<r+e.r);};
const front=(r,arc)=>foes(r).filter(e=>Math.abs(angDiff(Math.atan2(e.y-P.y,e.x-P.x),P.face))<arc);
const byDist=L=>L.sort((a,b)=>dist(a.x,a.y,P.x,P.y)-dist(b.x,b.y,P.x,P.y));
const at=(a,d)=>[P.x+Math.cos(a)*d,P.y+Math.sin(a)*d];
const heal=n=>{P.hp=Math.min(maxHP(),P.hp+n);};
function segHit(x1,y1,x2,y2,w,o){fxPush({k:'trail',x:x1,y:y1,x2,y2,w:Math.max(10,w*0.5),col:o.col||'#fff',life:.35});const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1;for(const e of enemies){if(e.dead)continue;const t=((e.x-x1)*dx+(e.y-y1)*dy)/L2;if(t<0||t>1)continue;const px=x1+dx*t,py=y1+dy*t;if(dist(px,py,e.x,e.y)<w/2+e.r)hitE(e,o,px,py);}}
const awA=()=>{const S=curStyle();return P&&P.awT>0&&S&&AWK[S.id]?AWK[S.id]:null;};
const awMoves=S=>{const B=MOVES[S.id]||[],A=P&&P.awT>0&&AWK[S.id];return A?B.map((m,i)=>A.m[i]?{n:A.m[i].n,cd:m.cd,f:A.m[i].f,aw:1,fix:A.m[i].fix||m.fix}:m):B;};
