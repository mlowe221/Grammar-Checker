 for(const e of enemies){if(e.dead)continue;const ax=Math.abs(e.x-x),ay=Math.abs(e.y-y);if(Math.abs(ax-ay)<W2+e.r&&ax<L*0.72)hitE(e,{kill:1,label:'Bx'+SQ()+'!',col:'#d9b34a'});}float(x,y-40,'BISHOP DIAGONAL!','#ffe08a');}

function showMastery(back){if(state==='play')state='pause';
 const list=STYLES.filter(s=>s.r>=4&&prog.owned.includes(s.id));const cards=list.length?list.map(st=>{const own=prog.owned.includes(st.id),lv=mlv(st.id);
  return `<div class="branch" style="text-align:left"><h3 style="color:${RAR[st.r].c};margin-bottom:4px">${esc(st.name)}</h3><p style="margin:0 0 8px;font-size:13px;color:#bba98a">${RAR[st.r].n} · Mastery ${lv}/4${own?'':' · not owned yet'}</p>`+
  mNodes(st.id).map((nd,i)=>{const done=lv>i,next=lv===i,can=own&&next&&prog.mp>=MCOST[i];return (i?`<div class="link ${done?'on':''}"></div>`:'')+`<button class="node ${done?'own':can?'can':''}" data-a="buy" data-id="${st.id}" data-i="${i}" ${done||!can?'disabled':''}><b><span>${esc(nd.n)}</span><span>${done?'✓':MCOST[i]+' MP'}</span></b><span>${nd.k}: ${esc(nd.d)}</span></button>`;}).join('')+'</div>';}).join(''):`<div class="branch" style="grid-column:1/-1;text-align:center"><p style="margin:6px 0">You don’t own any Mythic or Limited styles yet. Spin for one and its mastery path will appear here.</p></div>`;
 show(`<h2>Mastery</h2><p class="pts">${prog.mp} Mastery Point${prog.mp===1?'':'s'}</p><p class="note" style="margin:-6px 0 14px">Mastery Points come from slaying the Hydra King (5 the first time, 3 after) and from codes. Upgrades unlock in order for each Mythic and Limited style you own.</p><div class="tree" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cards}</div><button data-a="back">Done</button>`,1,
